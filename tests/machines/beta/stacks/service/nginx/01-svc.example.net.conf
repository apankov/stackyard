upstream service_app {
    server service-app:3000;
}

server {
	listen		80;
	server_name	svc.example.net;
	include		/etc/nginx/snippets/letsencrypt.conf;
	include		/etc/nginx/snippets/redirect-to-https.conf;
}

server {
	listen		443 ssl;
	server_name	svc.example.net;
	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/svc.example.net-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/svc.example.net.key;
	location / { proxy_pass http://service_app; }
}
