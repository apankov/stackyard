# A PHP site on the shared nginx and php-fpm, with a database in the shared
# MySQL. Exercises: a stack with no containers of its own, a database order,
# Requires.
Requires="mysql php-fpm"
Domains="app.example.com"
Mysql_DB="${Site_DB_Name}"
Mysql_User="${Site_DB_User}"
Mysql_Password="${Site_DB_Password}"
Mysql_Grants="SELECT,INSERT,UPDATE,DELETE"
Containers="no"
