server {
	listen		80;
	server_name	app.example.com;
	include		/etc/nginx/snippets/letsencrypt.conf;
	include		/etc/nginx/snippets/redirect-to-https.conf;
}

server {
	listen		443 ssl;
	# No http2 here: ssl-params.conf sets it, and a second one is a
	# "duplicate directive" that stops nginx from starting.
	server_name	app.example.com;

	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/app.example.com-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/app.example.com.key;

	limit_req	zone=req_general burst=40 nodelay;

	root		/var/www/vhosts/app.example.com/httpdocs;
	index		index.php;

	location ~ .php$ {
		fastcgi_pass	php-fpm:9000;
		include	/etc/nginx/fastcgi_params;
		fastcgi_param	SCRIPT_FILENAME	/var/www/vhosts/app.example.com/httpdocs$fastcgi_script_name;
	}
}
