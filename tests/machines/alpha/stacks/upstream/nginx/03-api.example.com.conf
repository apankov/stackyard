upstream demo_backend {
    server demo-backend:8080;
}

server {
	listen		80;
	server_name	api.example.com;
	include		/etc/nginx/snippets/letsencrypt.conf;
	include		/etc/nginx/snippets/redirect-to-https.conf;
}

server {
	listen		443 ssl;
	server_name	api.example.com;
	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/api.example.com-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/api.example.com.key;
	limit_req	zone=req_api burst=20 nodelay;
	location / { proxy_pass http://demo_backend; }
}
