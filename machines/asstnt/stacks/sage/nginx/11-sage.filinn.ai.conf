server {
    listen      80;
    server_name sage.filinn.ai;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/redirect-to-https.conf;
}

server {
    listen      443 ssl;
    server_name sage.filinn.ai;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    limit_req  zone=req_general burst=20 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/sage.filinn.ai-access;
    error_log   /var/log/nginx/sage.filinn.ai-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/sage.filinn.ai-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/sage.filinn.ai.key;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/gzip.conf;
    include     /etc/nginx/snippets/static-assets.conf;

    root  /var/www/vhosts/sage.filinn.ai;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
