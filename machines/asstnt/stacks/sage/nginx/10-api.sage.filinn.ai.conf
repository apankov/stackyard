server {
    listen      80;
    server_name api.sage.filinn.ai;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/redirect-to-https.conf;
}

server {
    listen      443 ssl;
    server_name api.sage.filinn.ai;

    # Audio uploads go straight to object storage from Phase 2 onward,
    # so nothing large ever passes through nginx.
    client_max_body_size 5m;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    # Это второй рубеж, а не первый: у /v1/auth/* есть собственный лимитер
    # в приложении, считающий по X-Real-IP (см. ниже про заголовки).
    limit_req  zone=req_api burst=40 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/api.sage.filinn.ai-access;
    error_log   /var/log/nginx/api.sage.filinn.ai-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/api.sage.filinn.ai-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/api.sage.filinn.ai.key;

    include     /etc/nginx/snippets/letsencrypt.conf;

    location / {
        proxy_pass http://sage-api:3210;

        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Overwrite, never append, on both headers: whatever a client sent
        # in X-Real-IP or X-Forwarded-For is discarded outright and replaced
        # with nginx's own view of the TCP peer, so no client-supplied value
        # ever survives this hop. `sage-api` does NOT use Fastify's
        # `trustProxy` option (left unset — see apps/api/src/app.ts) and
        # never reads X-Forwarded-For at all; the `/v1/auth/*` rate limiter's
        # `clientIp` key generator reads X-Real-IP directly instead. That
        # design, not a hop-count trust setting, is what makes trusting this
        # header safe.
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
