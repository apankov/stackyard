# The Telegram Mini App probe (#62). Same shape as
# 10-api.sage.filinn.ai.conf: a proxy to a container, not a document root —
# the bundle is built inside `sage-tgwebapp`'s image, so the devbox needs no
# node and no pnpm.
#
# Captures still go from the page to api.sage.filinn.ai directly over HTTPS;
# this vhost serves only the page itself, and nothing travels as a bot message.
server {
    listen      80;
    server_name tg.sage.filinn.ai;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/redirect-to-https.conf;
}

server {
    listen      443 ssl;
    server_name tg.sage.filinn.ai;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    limit_req  zone=req_general burst=20 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/tg.sage.filinn.ai-access;
    error_log   /var/log/nginx/tg.sage.filinn.ai-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/tg.sage.filinn.ai-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/tg.sage.filinn.ai.key;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/gzip.conf;

    # `static-assets.conf` is deliberately NOT included here (#117). It is a
    # regex `location` with an `expires` and no handler, and a regex location
    # outranks the prefix `location /` below — so every .js and .css request
    # stopped being proxied and was looked for on a disk this vhost has no
    # root on. The page loaded, its bundle 404'd, and the Mini App sat on
    # "Загружаю…" forever. The snippet is right for 11-sage.filinn.ai.conf,
    # which has a real document root; this vhost is a pure proxy, and caching
    # the bundle is already the container's own nginx's job.

    # Literal upstream with no `resolver`, like the API vhost: nginx resolves
    # it at startup, which is why this file must not be in place before
    # `sage-tgwebapp` exists — see "6 before 7" in deploy/README.md. The
    # routing and caching of the bundle live in the container's own nginx.
    location / {
        proxy_pass         http://sage-tgwebapp:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Telegram embeds the Mini App in a webview, so it must be framable — but
    # only by Telegram. `X-Frame-Options` cannot express that (it has no
    # allow-list beyond one origin), which is why this is a CSP instead.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;
}
