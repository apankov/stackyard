Requires="pg"
Domains="sage.filinn.ai api.sage.filinn.ai tg.sage.filinn.ai"

# Статика, которую раздаёт общий nginx.
#
# Переменная — из КОРНЕВОГО .env, а не из .env стека: этот том попадает в спеку
# nginx всегда, независимо от того, включён ли sage, а корневой .env
# загружается всегда. Дефолт обязателен — незаданная переменная схлопнулась бы
# в пустой путь, а это каталог-пустышка от root и 404 из места, которого никто
# не имел в виду. ./vhosts — заведомо существующий каталог, уже смонтированный
# в nginx.
#
# Значение дублирует ${Sage_Host_Home_Dir}/static из .env стека; расхождение
# ловит ./scripts/stack.sh --check, и это единственная причина, по которой
# дублирование терпимо.
# Nginx_Static_Sage_Dir уже включает подкаталог static — суффикса здесь быть
# не должно, иначе путь удвоится в .../static/static и nginx отдаст 404.
Static="sage.filinn.ai:${Nginx_Static_Sage_Dir:-./vhosts}"

# База в общем postgres. Значения — ссылки на .env стека, а не копии: вторая
# копия пароля разъезжается с ним молча и даёт
# `P1000 / password authentication failed` при живой базе.
Postgres_DB="${Sage_DB_Name}"
Postgres_User="${Sage_DB_User}"
Postgres_Password="${Sage_DB_Password}"
