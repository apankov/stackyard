services:

  tokensale-db:
    image: mariadb:10.3
    container_name: tokensale-db
    restart: always
    environment:
      # Слева — контракт образа mariadb. Справа — локальные имена девбокса из
      # stacks/tokensale/.env: секреты в git не лежат (CLAUDE.md §7).
      MARIADB_ROOT_PASSWORD: ${Tokensale_DB_Root_Password:?set Tokensale_DB_Root_Password in stacks/tokensale/.env}
      MARIADB_DATABASE: ${Tokensale_DB_Name:?set Tokensale_DB_Name in stacks/tokensale/.env}
    ports:
      # Петля, а не 0.0.0.0. Docker вставляет свои правила в цепочку DOCKER —
      # ДО INPUT, поэтому firewalld и iptables на хосте опубликованный порт не
      # закрывают, и единственным барьером остаётся security group инстанса.
      - "127.0.0.1:3306:3306"
    volumes:
      # Путь абсолютный и внутри стека: относительный compose резолвит от
      # каталога проекта, то есть в корень репозитория, где такого каталога
      # нет. Отсутствующий host-путь docker заводит сам и ОТ ROOT — в корне
      # появляется чужой пустой каталог, а init-скрипты не применяются.
      # Подробности — db-init/README.md.
      - ${HOST_DEPLOYMENT_DIR:?set HOST_DEPLOYMENT_DIR in .env}/stacks/tokensale/db-init:/docker-entrypoint-initdb.d
      - tokensale_mysql_data:/var/lib/mysql
    networks:
      - shared_network

  tokensale-backend:
    image: node:16-alpine
    container_name: tokensale-backend
    restart: always
    # Порт наружу не публикуется: до контейнера ходит только nginx, по имени
    # сервиса внутри devbox8-net (vhost 02-tokensale.bct.my-new-site.com.conf).
    # Опубликованный порт был обходом nginx, и только им.
    volumes:
      # Через переменную, а не /home/ec2-user/...: захардкоженный путь верен
      # ровно до первой машины с другим владельцем или другим каталогом
      # чекаута, а выглядит при этом рабочим. Проверяет это
      # `stack.sh --check`, блок «Декларации стеков».
      #
      # :ro — контейнер исполняет код именно отсюда, и без этого
      # скомпрометированный процесс node пишет в исходники, которые сам же
      # запускает. Если приложению нужен писчий путь, он монтируется отдельной
      # строкой, а не снятием :ro со всего чекаута.
      - ${Tokensale_Host_Home_Dir:?set Tokensale_Host_Home_Dir in stacks/tokensale/.env}:/app:ro
    environment:
      PORT: 3200
    depends_on:
      - tokensale-db
    working_dir: /app
    networks:
      - shared_network
    command: node /app/src/server.js

volumes:
  tokensale_mysql_data:
