services:
  storage-receiver:
    build: stacks/webhooks/app/
    container_name: storage-receiver
    # Порт наружу не публикуется: до контейнера ходит только nginx, по имени
    # сервиса внутри devbox8-net (vhost 01-webhooks.sanya.my-new-site.com.conf).
    # Прямой порт обходил vhost, то есть и TLS, и логи доступа.
    environment:
      PORT: $WEBHOOKS_PORT
      STORAGE_PATH: /storage
      AUTH_TOKEN: $WEBHOOKS_AUTH_TOKEN
      BUCKET_NAME: $WEBHOOKS_BUCKET_NAME
    volumes:
      # Папка для хранения принятых файлов. Настройки приложение получает
      # переменными окружения выше, файла .env внутрь контейнера не монтируется.
      - $WEBHOOKS_STORAGE:/storage
    restart: unless-stopped
    networks:
      - shared_network
