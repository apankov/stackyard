# Local Matrix homeserver + web client for the Sanya research/demo stand.
#
# Why this exists:
#   We don't want to bring real people into early-stage agent testing. This
#   stand lets you spin up arbitrary "users" (some you drive in a browser,
#   some driven by LLM bot personas) against a real Matrix server, and point
#   the harness at it via a Matrix transport adapter.
#
# Quick start:
#   cd docker/matrix-stand
#   docker compose up -d
#   # Element web on http://localhost:8009 — register accounts there.
#   # (Use the registration token from .env, see below.)
#
# Account creation:
#   Easiest is Element's "Create Account" form. It will hit the Conduit CS
#   API at http://localhost:8008 and ask for the registration token. Use
#   the value of CONDUIT_REGISTRATION_TOKEN from .env.
#
# Server identity:
#   server_name = sanya.local. Federation is OFF, so this name only needs
#   to be self-consistent — accounts look like @alice:sanya.local.
#
# Volumes:
#   conduit-data is a named volume (./data is gitignored). Wipe with
#   `docker compose down -v` if you want a clean slate.

services:
  conduit:
    image: matrixconduit/matrix-conduit:latest
    # container_name: sanya-conduit
    container_name: matrix-server
    restart: unless-stopped
    networks:
      - shared_network
    ports:
      # Петля, а не 0.0.0.0. Docker вставляет свои правила в цепочку DOCKER —
      # ДО INPUT, поэтому firewalld и iptables на хосте опубликованный порт не
      # закрывают, и единственным барьером остаётся security group инстанса.
      # Стенд: домена и vhost'а у него нет, снаружи он не нужен вообще.
      # Доступ — ssh-туннелем: ssh -L 8008:127.0.0.1:8008 ec2-user@devbox
      - "127.0.0.1:8008:6167"          # host:container — CS API
    volumes:
      - conduit-data:/var/lib/matrix-conduit
      - ${HOST_DEPLOYMENT_DIR:?set HOST_DEPLOYMENT_DIR in .env}/stacks/matrix/config/conduit.toml:/etc/conduit.toml:ro
    environment:
      # Recent Conduit images require CONDUIT_CONFIG to point at a real
      # TOML file. Settings in that TOML are the baseline; CONDUIT_*
      # env vars below override them.
      CONDUIT_CONFIG: /etc/conduit.toml
      CONDUIT_REGISTRATION_TOKEN: ${CONDUIT_REGISTRATION_TOKEN:-sanya-stand}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6167/_matrix/client/versions || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  element:
    image: vectorim/element-web:latest
    container_name: matrix-element
    restart: unless-stopped
    networks:
      - shared_network
    ports:
      # Петля, а не 0.0.0.0. Docker вставляет свои правила в цепочку DOCKER —
      # ДО INPUT, поэтому firewalld и iptables на хосте опубликованный порт не
      # закрывают, и единственным барьером остаётся security group инстанса.
      # Element того же стенда: ssh -L 8009:127.0.0.1:8009 ec2-user@devbox
      - "127.0.0.1:8009:80"
    volumes:
      - ${HOST_DEPLOYMENT_DIR:?set HOST_DEPLOYMENT_DIR in .env}/stacks/matrix/config/element-config.json:/app/config.json:ro
    depends_on:
      - conduit

volumes:
  conduit-data:

