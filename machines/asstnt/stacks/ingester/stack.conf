# Конвейер знаний: транскрипты встреч -> задачи и знания в Obsidian.
# Рунбук — README.md рядом.

Requires="pg"

# Доменов нет: у стека нет веб-поверхности. Наружу он не слушает вообще —
# ни порта, ни vhost'а. Входы: опрос источников, папка «входящие» в волте
# и ветка `mac`, которую присылает по SSH мак Андрея.

# База в общем postgres. Значения — ссылки на .env стека, а не копии:
# вторая копия пароля разъезжается молча и даёт
# `P1000 / password authentication failed` при живой базе.
Postgres_DB="${Ingester_DB_Name}"
Postgres_User="${Ingester_DB_User}"
Postgres_Password="${Ingester_DB_Password}"

# Единственное, что здесь невосстановимо.
#
# База конвейера производная: её можно выбросить и пересобрать из файлов.
# Файлы — нет. В ${Ingester_Data_Dir} лежат репозиторий сырья (транскрипты,
# неизменяемые, у источников они хранятся не вечно) и машинный волт
# с тем, что Андрей написал руками вне машинных блоков.
#
# Путь обязан существовать до включения стека: backup.sh падает на
# отсутствующем источнике, и падает не только за нас.
Backup_Files="${Ingester_Data_Dir}/raw ${Ingester_Data_Dir}/machine"
