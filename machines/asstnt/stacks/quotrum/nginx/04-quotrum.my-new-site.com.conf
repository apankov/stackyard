server {
    listen      80;
    server_name quotrum.my-new-site.com;

    client_max_body_size 10m;

    include     /etc/nginx/snippets/letsencrypt.conf;

    include     /etc/nginx/snippets/redirect-to-https.conf;
}


server {
    listen      443 ssl;
    server_name quotrum.my-new-site.com;

    # Ограничиваем размер тела запроса до 10 МБ на уровне Nginx,
    # чтобы боты не забили память Node.js тяжелыми файлами
    client_max_body_size 10m;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    limit_req  zone=req_general burst=20 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/quotrum.my-new-site.com-access;
    error_log   /var/log/nginx/quotrum.my-new-site.com-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/quotrum.my-new-site.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/quotrum.my-new-site.com.key;

    include     /etc/nginx/snippets/letsencrypt.conf;

    location / {
        # БЕЗ auth_basic, и это решение, а не забытая строка.
        #
        # Через этот же хост проходит callback Google OAuth
        # (Quotrum__Google_Redirect_URI): basic auth на нём означает, что
        # Google получает 401 на редиректе и вход в приложение перестаёт
        # работать целиком. У приложения своя аутентификация — Google OAuth
        # плюс сессия на SECRET_KEY.
        #
        # Если понадобится дополнительный слой, он вешается на конкретные
        # страницы, а не на `location /`, и мимо пути OAuth.
        proxy_pass http://quotrum-app:8000;

        # Передача правильных заголовков, чтобы приложение знало реальные IP
        # клиентов. Здесь uvicorn/FastAPI, а не Node.js — строка про Node приехала
        # копированием из соседнего vhost'а.
        proxy_http_version 1.1;
        # $connection_upgrade, а не 'upgrade' безусловно: карта в
        # platform/nginx-vhosts/00-proxy-upgrade.conf отдаёт `upgrade` только
        # там, где клиент действительно просит смены протокола.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Сбрасываем таймауты для долго висящих соединений, если вебхуки идут пачками
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
