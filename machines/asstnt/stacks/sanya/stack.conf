# bod-assistant-2: Python/uv + SQLite + Telegram. НЕ путать с sanya-next —
# это разные проекты с одним смыслом, разными базами и доменами.
Requires="qdrant"
Domains="operator.sanya.my-new-site.com"

# Живая база SQLite: снимается через `.backup`, а не копированием файла.
# Имя файла берётся из Sanya_DB_Path (это путь ВНУТРИ контейнера, но имя там
# то же). Хардкод twd.db был бы неверен уже на текущей машине — там twd-tm.db.
Backup_Sqlite="${Sanya_Host_DB_Dir}/${Sanya_DB_File}"
