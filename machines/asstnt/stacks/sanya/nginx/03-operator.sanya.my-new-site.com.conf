server {
    listen      80;
    server_name operator.sanya.my-new-site.com;

    client_max_body_size 10m;

    include     /etc/nginx/snippets/letsencrypt.conf;

    include     /etc/nginx/snippets/redirect-to-https.conf;
}


server {
    listen      443 ssl;
    server_name operator.sanya.my-new-site.com;

    # Ограничиваем размер тела запроса до 10 МБ на уровне Nginx,
    # чтобы боты не забили память Node.js тяжелыми файлами
    client_max_body_size 10m;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    limit_req  zone=req_general burst=20 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/operator.sanya.my-new-site.com-access;
    error_log   /var/log/nginx/operator.sanya.my-new-site.com-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/operator.sanya.my-new-site.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/operator.sanya.my-new-site.com.key;

    include     /etc/nginx/snippets/letsencrypt.conf;

    # Главный локейшн для проксирования всех запросов в контейнер Node.js
    location / {
        # Включаем Basic Auth для всего проксируемого трафика
        auth_basic           "Restricted Access";
        auth_basic_user_file /etc/nginx/htpasswd/operator.sanya.my-new-site.com;

        proxy_pass http://sanya-operator:3456;

        # Передача правильных заголовков, чтобы Node.js знал реальные IP клиентов
        proxy_http_version 1.1;
        # $connection_upgrade, а не 'upgrade' безусловно: карта в
        # platform/nginx-vhosts/00-proxy-upgrade.conf отдаёт `upgrade` только
        # там, где клиент действительно просит смены протокола.
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Сбрасываем таймауты для долго висящих соединений, если вебхуки идут пачками
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
