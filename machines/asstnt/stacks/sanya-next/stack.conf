# Next.js + Prisma + Postgres + Teams. НЕ путать с sanya.
Requires="pg"
Domains="sanya-next.my-new-site.com"

# Подвижный тег в ECR, за которым следит `./scripts/registry.sh pin sanya-next`:
# он резолвит его в digest и кладёт в stacks/sanya-next/.env. Запускается стек
# всегда от digest'а — тег отвечает «за чем следим» и одинаков на всех машинах,
# поэтому живёт здесь, а не в .env.
Image_Tag="master"

# База в общем postgres. Создаётся с OWNER = Postgres_User, поэтому
# `prisma migrate deploy` может создавать таблицы в схеме public: с PG15 она
# принадлежит pg_database_owner.
Postgres_DB="${SanyaNext_DB_Name}"
Postgres_User="${SanyaNext_DB_User}"
Postgres_Password="${SanyaNext_DB_Password}"
