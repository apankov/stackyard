server {
    listen      80;
    server_name sanya-next.my-new-site.com;

    include     /etc/nginx/snippets/letsencrypt.conf;
    include     /etc/nginx/snippets/redirect-to-https.conf;
}

server {
    listen      443 ssl;
    server_name sanya-next.my-new-site.com;

    # Транскрипты созвонов приходят через POST /api/ingest как plain text.
    # Час разговора в VTT — сотни килобайт; 10m с запасом и при этом не даёт
    # забить память Node тяжёлыми файлами.
    client_max_body_size 10m;

    # Ограничение частоты запросов. Зоны — platform/nginx-vhosts/00-limits.conf.
    # На этом же хосте живёт вебхук Bot Framework, поэтому зона вебхучная:
    # зарезанное сообщение Teams не ретраится вечно.
    limit_req  zone=req_webhook burst=60 nodelay;
    limit_conn conn_addr 20;

    access_log  /var/log/nginx/sanya-next.my-new-site.com-access;
    error_log   /var/log/nginx/sanya-next.my-new-site.com-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/sanya-next.my-new-site.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/sanya-next.my-new-site.com.key;

    include     /etc/nginx/snippets/letsencrypt.conf;

    location / {
        # БЕЗ auth_basic — в отличие от 03-operator.sanya.my-new-site.com.conf,
        # и это не упущение:
        #  1) на этом же хосте живёт вебхук Bot Framework
        #     (/api/teams/messages и алиас /api/messages). Microsoft basic auth
        #     не умеет — под htpasswd бот просто перестанет получать сообщения;
        #  2) у админки есть своя аутентификация: логин/пароль из admin_users +
        #     session token в httpOnly+Secure cookie, гейт стоит на всех
        #     страницах группы (app) и на route handlers.
        # Если понадобится дополнительный слой — он вешается ТОЛЬКО на
        # `location = /` и страницы админки, никогда на `/api/`.
        proxy_pass http://sanya-next-app:3000;

        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # Обязателен: без него Next за прокси считает схему http и собирает
        # неверные абсолютные ссылки.
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Заголовков Upgrade/Connection здесь нет намеренно: websocket'ов и SSE
        # в приложении нет — правая панель и «Мышление» опрашивают
        # /api/sanya-activity и /api/sanya-mind обычным fetch по интервалу.
        # Безусловный `Connection: upgrade` на каждом запросе только ломает
        # keepalive.

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # 300s, а не 60: разбор транскрипта запускается кнопкой на странице
        # события и идёт через Server Action в том же запросе. Пайплайн — это
        # extract×2 → verify → classify → normalize (на Opus) → резолвер
        # обязательств, то есть минуты, а не секунды. При 60s nginx рвёт
        # соединение на середине, и снаружи это выглядит как «кнопка не
        # работает», хотя разбор в контейнере продолжается.
        proxy_read_timeout    300s;
    }
}
