# Стек `sanya-next` — Саня на Next.js 15 + Prisma + Postgres + Microsoft Teams
# (репозиторий internal_ai_automations/sanya).
#
# ПОЧЕМУ ИМЯ НЕ `sanya`. В этом деплое имя `sanya` занято другим проектом: стек
# `sanya` собирает `bod-assistant-2` (Python/uv, SQLite, Telegram, mem0+Qdrant,
# контейнеры sanya-mcp-server / sanya-harness / sanya-operator). Это тот же
# продукт по смыслу и другая реализация по стеку.
# Два стека живут рядом и не пересекаются ни именами контейнеров, ни базой,
# ни доменом.
#
# Левые имена переменных (DATABASE_URL, APP_BASE_URL, TEAMS_*) — контракт самого
# приложения (`src/env.ts`), их переименовывать нельзя. Правые (SanyaNext_*)
# приходят из `stacks/sanya-next/.env` и следуют конвенции девбокса; они локальны для
# этого деплоя и переименовываются свободно.
#
# Приложение — ДВА процесса из одного образа, и это не деталь оформления:
# у них нет общей памяти, поэтому любой in-memory кэш существует в каждом свой
# (см. CLAUDE.md §2 репозитория). `app` держит админку и вебхуки Teams,
# `cron` — все фоновые джобы.

services:

  sanya-next-app:
    ### Образ приходит ГОТОВЫМ из ECR и по DIGEST'у, а не по тегу.
    ###
    ### Хост и репозиторий стоят литералом намеренно: их читает платформа
    ### (scripts/registry.sh, stack.sh purge) у стека, который на этой машине
    ### может быть выключен, а значит .env у него может не быть вовсе.
    ###
    ### Digest, а не `:master`, по двум причинам. `up -d` с подвижным тегом
    ### берёт локальный слепок и молча расходится с реестром — «перезапустил, а
    ### версия та же». И откатываться некуда: предыдущего тега не существует, в
    ### реестре под `master` всегда последнее. Строка ниже отвечает на вопрос
    ### «что сейчас запущено», меняет её `./scripts/registry.sh pin sanya-next`,
    ### а откат — вернуть прежний digest и `up -d`, пока образ есть локально
    ### (`docker images --digests | grep sanya`).
    ###
    ### `build:` здесь нет и быть не должно: с ним compose на недоступном
    ### реестре молча уходил бы в `next build` на машине с 916 МБ RAM, то есть в
    ### CLAUDE.md §3.3. Без него отказ честный — «manifest unknown».
    image: 841176798275.dkr.ecr.eu-north-1.amazonaws.com/sanya@${SanyaNext_Image_Digest:?not set in stacks/sanya-next/.env — run ./scripts/registry.sh pin sanya-next}
    container_name: sanya-next-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Базу и пользователя создаёт db-initializer из stacks/pg/db-init/databases.yaml.
      # `prisma migrate deploy` в entrypoint приложения падёт, если базы ещё нет,
      # поэтому ждём именно ЗАВЕРШЕНИЯ инициализатора, а не просто его старта.
      # Он идемпотентен («База уже существует. Пропускаем.»), так что повторный
      # up ничего не ломает.
      db-initializer:
        condition: service_completed_successfully
    environment:
      # NODE_ENV, NEXT_TELEMETRY_DISABLED, PORT и HOSTNAME уже выставлены в
      # runner-слое образа — здесь не дублируем, чтобы не разошлись.
      LOG_LEVEL: ${SanyaNext_Log_Level}

      # Общий контейнер postgres на той же сети. Строку собираем здесь, а не в
      # .env-файле: пароль и имя базы всё равно нужны отдельно (db-initializer),
      # а два места с одним и тем же URL разъезжаются.
      DATABASE_URL: "postgresql://${SanyaNext_DB_User}:${SanyaNext_DB_Password}@${SanyaNext_DB_Host}:${SanyaNext_DB_Port}/${SanyaNext_DB_Name}?schema=public&connection_limit=10&pool_timeout=20"
      # Отдельно от DATABASE_URL: docker/docker-entrypoint.sh ждёт порт через
      # `nc -z $POSTGRES_HOST $POSTGRES_PORT` и URL не парсит.
      POSTGRES_HOST: ${SanyaNext_DB_Host}
      POSTGRES_PORT: "${SanyaNext_DB_Port}"

      # Миграции накатывает ТОЛЬКО app. У cron стоит false — два процесса,
      # одновременно вызывающие `migrate deploy`, борются за advisory lock.
      RUN_MIGRATIONS: "true"

      # Публичный адрес установки. Обязателен и без fallback'а: из него агент
      # собирает ссылки на логин, которые шлёт админам кругов в личку. Не задан —
      # приложение падает на старте, и это лучше, чем рассылка на чужой хост.
      APP_BASE_URL: ${SanyaNext_App_Base_URL:?set SanyaNext_App_Base_URL in stacks/sanya-next/.env}

      ANTHROPIC_API_KEY: ${SanyaNext_Anthropic_API_Key}
      GOOGLE_GENERATIVE_AI_API_KEY: ${SanyaNext_Google_API_Key}
      MODEL_EXTRACT: ${SanyaNext_Model_Extract}
      MODEL_DRAFT: ${SanyaNext_Model_Draft}
      MODEL_BRIEF: ${SanyaNext_Model_Brief}
      MODEL_NORMALIZE: ${SanyaNext_Model_Normalize}
      MODEL_REASONING: ${SanyaNext_Model_Reasoning}

      DEFAULT_CIRCLE_SLUG: ${SanyaNext_Default_Circle_Slug}
      DEFAULT_CIRCLE_NAME: ${SanyaNext_Default_Circle_Name}
      OPERATOR_TIMEZONE: ${SanyaNext_Operator_Timezone}
      DAILY_BRIEF_CRON: ${SanyaNext_Daily_Brief_Cron}
      OPERATOR_AAD_ID: ${SanyaNext_Operator_AAD_Id}
      INGEST_API_TOKEN: ${SanyaNext_Ingest_API_Token}

      TEAMS_ENABLED: "${SanyaNext_Teams_Enabled}"
      MICROSOFT_APP_ID: ${SanyaNext_Microsoft_App_Id}
      MICROSOFT_APP_PASSWORD: ${SanyaNext_Microsoft_App_Password}
      MICROSOFT_APP_TENANT_ID: ${SanyaNext_Microsoft_App_Tenant_Id}
      MICROSOFT_APP_TYPE: ${SanyaNext_Microsoft_App_Type}
      TEAMS_APP_CATALOG_ID: ${SanyaNext_Teams_App_Catalog_Id}
      TEAMS_FOLLOWUP_ONLY: "${SanyaNext_Teams_Followup_Only}"
      TEAMS_AUTOJOIN_ENABLED: "${SanyaNext_Teams_Autojoin_Enabled}"

      PROJECT_MODEL: "${SanyaNext_Project_Model}"
      MEMORY_ENABLED: "${SanyaNext_Memory_Enabled}"
      LIFECYCLE_RESOLVER: "${SanyaNext_Lifecycle_Resolver}"
      NUDGE_DM_ENABLED: "${SanyaNext_Nudge_DM_Enabled}"
      LIBRARIAN_AUTO: "${SanyaNext_Librarian_Auto}"
      GOAL_PLANNING_ENABLED: "${SanyaNext_Goal_Planning_Enabled}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # Первый старт включает `migrate deploy`, поэтому запас больше обычного.
      start_period: 60s
    stop_grace_period: 30s
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - shared_network
    # Нет `ports:` намеренно. Наружу смотрит общий nginx, он ходит в контейнер
    # по имени на shared_network. На хосте приложение не публикуется вообще.

  sanya-next-cron:
    # Тот же образ и тот же digest, что у sanya-next-app — иначе два процесса
    # одного приложения разъедутся по версиям, и это заметят не сразу.
    image: 841176798275.dkr.ecr.eu-north-1.amazonaws.com/sanya@${SanyaNext_Image_Digest:?not set in stacks/sanya-next/.env — run ./scripts/registry.sh pin sanya-next}
    container_name: sanya-next-cron
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Ждём, пока app накатит миграции: cron сразу начинает читать те же таблицы.
      sanya-next-app:
        condition: service_healthy
    command: ["node", "dist/cron.js"]
    environment:
      LOG_LEVEL: ${SanyaNext_Log_Level}

      # connection_limit ниже, чем у app: джобы короткие и их немного.
      DATABASE_URL: "postgresql://${SanyaNext_DB_User}:${SanyaNext_DB_Password}@${SanyaNext_DB_Host}:${SanyaNext_DB_Port}/${SanyaNext_DB_Name}?schema=public&connection_limit=5"
      POSTGRES_HOST: ${SanyaNext_DB_Host}
      POSTGRES_PORT: "${SanyaNext_DB_Port}"
      RUN_MIGRATIONS: "false"

      APP_BASE_URL: ${SanyaNext_App_Base_URL:?set SanyaNext_App_Base_URL in stacks/sanya-next/.env}

      ANTHROPIC_API_KEY: ${SanyaNext_Anthropic_API_Key}
      GOOGLE_GENERATIVE_AI_API_KEY: ${SanyaNext_Google_API_Key}
      MODEL_EXTRACT: ${SanyaNext_Model_Extract}
      MODEL_DRAFT: ${SanyaNext_Model_Draft}
      MODEL_BRIEF: ${SanyaNext_Model_Brief}
      MODEL_NORMALIZE: ${SanyaNext_Model_Normalize}
      MODEL_REASONING: ${SanyaNext_Model_Reasoning}

      DEFAULT_CIRCLE_SLUG: ${SanyaNext_Default_Circle_Slug}
      DEFAULT_CIRCLE_NAME: ${SanyaNext_Default_Circle_Name}
      OPERATOR_TIMEZONE: ${SanyaNext_Operator_Timezone}
      DAILY_BRIEF_CRON: ${SanyaNext_Daily_Brief_Cron}
      OPERATOR_AAD_ID: ${SanyaNext_Operator_AAD_Id}

      TEAMS_ENABLED: "${SanyaNext_Teams_Enabled}"
      MICROSOFT_APP_ID: ${SanyaNext_Microsoft_App_Id}
      MICROSOFT_APP_PASSWORD: ${SanyaNext_Microsoft_App_Password}
      MICROSOFT_APP_TENANT_ID: ${SanyaNext_Microsoft_App_Tenant_Id}
      MICROSOFT_APP_TYPE: ${SanyaNext_Microsoft_App_Type}
      TEAMS_APP_CATALOG_ID: ${SanyaNext_Teams_App_Catalog_Id}
      TEAMS_FOLLOWUP_ONLY: "${SanyaNext_Teams_Followup_Only}"
      TEAMS_AUTOJOIN_ENABLED: "${SanyaNext_Teams_Autojoin_Enabled}"
      TEAMS_APP_ID: "${SanyaNext_Microsoft_Teams__App_Id}"

      PROJECT_MODEL: "${SanyaNext_Project_Model}"
      MEMORY_ENABLED: "${SanyaNext_Memory_Enabled}"
      LIFECYCLE_RESOLVER: "${SanyaNext_Lifecycle_Resolver}"
      NUDGE_DM_ENABLED: "${SanyaNext_Nudge_DM_Enabled}"
      LIBRARIAN_AUTO: "${SanyaNext_Librarian_Auto}"
      GOAL_PLANNING_ENABLED: "${SanyaNext_Goal_Planning_Enabled}"
    healthcheck:
      # Воркер пишет heartbeat в /tmp/cron.alive. Здоровым считаем, пока файл
      # свежее 180 секунд: самая частая джоба ходит раз в минуту.
      test: ["CMD-SHELL", "test $(($(date +%s) - $(stat -c %Y /tmp/cron.alive 2>/dev/null || echo 0))) -lt 180"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - shared_network

# Нет верхнеуровневого блока `networks:` — `shared_network` объявлен в корневом
# docker-compose.yaml, а docker-compose.sh сливает все файлы одним вызовом
# `docker compose` и создаёт сеть, если её нет. Повторное объявление здесь было
# бы лишним.
