# ============================================================================
# alf.my-new-site.com — единый vhost для прототипа Альфа AI-ассистента
# ============================================================================
# Маршрутизация (порядок важен — locations матчатся сверху вниз):
#   /socket.io/    → Node.js backend на 127.0.0.1:4001 (WebSocket upgrade)
#   /api/          → Node.js backend на 127.0.0.1:4001 (REST: /health, /trigger, ...)
#   /              → статика из /var/www/vhosts/alf.my-new-site.com/httpdocs
#
# Подготовка перед деплоем:
#   1. Положите alf-static/public/index.html → /var/www/vhosts/.../httpdocs/
#   2. Запустите alf-backend на 127.0.0.1:4001 (systemd-сервис рекомендуется)
#   3. На фронте поменяйте BACKEND_URL: используйте location.origin вместо :4001
# ============================================================================

# Upstream для бэка. ip_hash важен если когда-нибудь поднимется несколько
# процессов бэка — Socket.IO требует sticky sessions.
upstream alf_backend {
    ip_hash;
    server alf-backend:4001;
    keepalive 32;
}

# ---------- HTTP → HTTPS ----------
server {
    listen      80;
    server_name alf.my-new-site.com;

    client_max_body_size 32m;

    include /etc/nginx/snippets/letsencrypt.conf;

    include /etc/nginx/snippets/redirect-to-https.conf;
}

# ---------- HTTPS — основной vhost ----------
server {
    listen      443 ssl;
    http2       on;
    server_name alf.my-new-site.com;

    client_max_body_size 30m;

    access_log /var/log/nginx/alf.my-new-site.com-access;
    error_log  /var/log/nginx/alf.my-new-site.com-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/alf.my-new-site.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/alf.my-new-site.com.key;

    include /etc/nginx/snippets/letsencrypt.conf;

    # Корень для статики
    root  /var/www/vhosts/alf.my-new-site.com/httpdocs;
    index index.html;

    # ============================================================
    # Socket.IO — WebSocket upgrade
    # ============================================================
    # Должен идти ДО общего location / иначе перехватится статикой.
    # Путь /socket.io/ — это дефолт клиента и сервера socket.io,
    # его не надо переименовывать.
    location /socket.io/ {
        # Стоимость здесь — удерживаемое соединение, а не частота запросов:
        # при proxy_read_timeout 3600s без лимита бэкенд кладётся парой тысяч
        # открытых сокетов. Поэтому limit_conn, а не limit_req.
        limit_conn conn_ws 10;

        proxy_pass http://alf_backend;

        # Три обязательных параметра для WebSocket upgrade
        proxy_http_version  1.1;
        proxy_set_header    Upgrade     $http_upgrade;
        proxy_set_header    Connection  "upgrade";

        # Прокидываем оригинальный хост и IP клиента
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        # Длинные таймауты — иначе nginx рвёт долгоживущие WS-коннекты
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Не буферизуем — события (ai:organism, ai:trigger) должны проходить мгновенно
        proxy_buffering     off;
    }

    # ============================================================
    # REST API бэка
    # ============================================================
    # /api/health, /api/users, /api/trigger → бэк без префикса (rewrite убирает /api)
    location /api/ {
        limit_req zone=req_api burst=20 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://alf_backend;

        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;

        add_header Cache-Control "no-store" always;
    }

    # ============================================================
    # Статика прототипа (HTML, JS, CSS, картинки)
    # ============================================================
    location / {
        root    /var/www/vhosts/alf.my-new-site.com/httpdocs;
        index   index.html;
        # try_files $uri $uri/ /index.html;
    }

    # Кэширование ассетов на 30 дней
    location ~* \.(jpg|jpeg|gif|png|webp|svg|ico|woff2?|ttf|css|js)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML не кэшируем — прототип меняется часто, иначе у пользователей будет старая версия
    location ~* \.html$ {
        add_header Cache-Control "no-store" always;
        expires off;
    }
}
