server {
	listen		80;
	server_name	www.12devs.com 12devs.com;

	include		/etc/nginx/snippets/letsencrypt.conf;

	location ^~ /robots.txt {
		return 200 "User-agent: *\nDisallow: /\n";
	}

	rewrite ^/$             https://twelvedevs.com/ permanent;
	rewrite ^/contact$      https://twelvedevs.com/contact permanent;
	rewrite ^/join$         https://twelvedevs.com/ permanent;
	rewrite ^/company$      https://twelvedevs.com/ permanent;

	rewrite ^/portfolio$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/4$    https://twelvedevs.com/portfolio/keensafety permanent;
	rewrite ^/project/8$    https://twelvedevs.com/portfolio/digital-transformation-of-logistics-company permanent;
	rewrite ^/project/7$    https://twelvedevs.com/portfolio/cgblockchain permanent;
	rewrite ^/project/11$   https://twelvedevs.com/portfolio/top-transcriber permanent;

	rewrite ^/project/13$   https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/2$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/9$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/10$   https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/3$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/5$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/6$    https://twelvedevs.com/portfolio permanent;

	location / {
		return  301     https://twelvedevs.com$request_uri;
	}
}



server {
	listen		443 ssl;
	listen		[::]:443 ssl;
	http2		on;
	server_name	www.12devs.com 12devs.com;

	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/12devs.com-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/12devs.com.key;

	include		/etc/nginx/snippets/letsencrypt.conf;

	location ^~ /robots.txt {
		return 200 "User-agent: *\nDisallow: /\n";
	}


	rewrite ^/$             https://twelvedevs.com/ permanent;
	rewrite ^/contact$      https://twelvedevs.com/contact permanent;
	rewrite ^/join$         https://twelvedevs.com/ permanent;
	rewrite ^/company$      https://twelvedevs.com/ permanent;

	rewrite ^/portfolio$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/4$    https://twelvedevs.com/portfolio/keensafety permanent;
	rewrite ^/project/8$    https://twelvedevs.com/portfolio/digital-transformation-of-logistics-company permanent;
	rewrite ^/project/7$    https://twelvedevs.com/portfolio/cgblockchain permanent;
	rewrite ^/project/11$   https://twelvedevs.com/portfolio/top-transcriber permanent;

	rewrite ^/project/13$   https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/2$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/9$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/10$   https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/3$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/5$    https://twelvedevs.com/portfolio permanent;
	rewrite ^/project/6$    https://twelvedevs.com/portfolio permanent;

	location / {
		return  301     https://twelvedevs.com$request_uri;
	}
}
