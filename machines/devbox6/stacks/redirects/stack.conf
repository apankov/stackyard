# Домены, которые остались только ради 301 на twelvedevs.com. Контейнеров нет,
# docroot'а нет — одни rewrite'ы.
#
# Два домена в одном стеке потому, что включать и выключать их порознь смысла
# нет: они живут и умирают вместе с решением «редиректить на twelvedevs.com».
#
# Форма `домен+алиас` означает один сертификат на несколько имён (SANS).
# www-имена обслуживаются теми же server-блоками, и без SANS сертификат на
# голый домен им не годится — браузер ругается только на www, то есть отказ
# видно не всем и не сразу.
Requires=""
Domains="12devs.com+www.12devs.com 12devs.by+www.12devs.by"
