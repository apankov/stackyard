server {
	listen		80;
	server_name	andrey.pankov.me;

	client_max_body_size 32m;

	include		/etc/nginx/snippets/letsencrypt.conf;

	include		/etc/nginx/snippets/redirect-to-https.conf;
}



server {
	listen		443 ssl;
	http2		on;
	server_name	andrey.pankov.me;

	access_log	/var/log/nginx/andrey.pankov.me-access;
	error_log	/var/log/nginx/andrey.pankov.me-error;

	root		/var/www/vhosts/andrey.pankov.me/httpdocs;
	index		index.html;

	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/andrey.pankov.me-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/andrey.pankov.me.key;

	include		/etc/nginx/snippets/letsencrypt.conf;

	location / {
		root	/var/www/vhosts/andrey.pankov.me/httpdocs;
		index	index.html;
	}

	location /books {
		# root  /var/www/vhosts/andrey.pankov.me/books;
		autoindex       on;
	}

	location ~* ^.+.(jpg|jpeg|gif|css|png|js|ico)$ {
		access_log	off;
		expires	30d;
	}
}
