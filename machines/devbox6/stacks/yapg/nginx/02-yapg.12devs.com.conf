server {
    listen              80;
    server_name         yapg.12devs.com;

    client_max_body_size 32m;

    include             /etc/nginx/snippets/letsencrypt.conf;

    include             /etc/nginx/snippets/redirect-to-https.conf;
}



server {
    listen              443 ssl;
    http2               on;
    server_name         yapg.12devs.com;

    access_log          /var/log/nginx/yapg.12devs.com-access;
    error_log           /var/log/nginx/yapg.12devs.com-error;

    root                /var/www/vhosts/yapg.12devs.com/httpdocs;
    index               index.html;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/yapg.12devs.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/yapg.12devs.com.key;

    include             /etc/nginx/snippets/letsencrypt.conf;

    # .webmanifest отсутствует в дефолтной таблице типов nginx, поэтому манифест
    # уходил как application/octet-stream и не разбирался — установка PWA ломалась.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Ревалидация всего. Service worker работает cache-first, имена файлов не
    # хешированы, а cache.addAll во время install читает HTTP-кеш — то есть при
    # 30-дневном max-age свежая VERSION наполнила бы новый кеш месячными файлами.
    # ETag'и уже отдаются, поэтому ревалидация стоит один 304.
    expires -1;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Артефакт Cloudflare Pages: здесь бесполезен и читается как текст.
    location = /_headers { return 404; }

    location ~* \.(css|js|svg|png|ico|webmanifest)$ {
        access_log off;
    }
}
