server {
	listen		80;
	server_name	storage.my-new-site.com;

	client_max_body_size 32m;

	include		/etc/nginx/snippets/letsencrypt.conf;

	include		/etc/nginx/snippets/redirect-to-https.conf;
}



server {
	listen		443 ssl;
	http2		on;
	server_name	storage.my-new-site.com;
	client_max_body_size 30m;

	access_log	/var/log/nginx/storage.my-new-site.com-access;
	error_log	/var/log/nginx/storage.my-new-site.com-error;

	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/storage.my-new-site.com-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/storage.my-new-site.com.key;

	include		/etc/nginx/snippets/letsencrypt.conf;

	# Server level on purpose: the rewrite in "location /" runs in the rewrite
	# phase, which precedes the preaccess phase where limit_req is evaluated, so
	# a limit inside that location would never take effect.
	limit_req	zone=req_api burst=20 nodelay;

	root		/var/www/vhosts/storage.my-new-site.com/httpdocs;
	index		index.php;

	location = / {
		root	/var/www/vhosts/storage.my-new-site.com/httpdocs;
		index	index.php;
	}

	location / {
		root	/var/www/vhosts/storage.my-new-site.com/httpdocs;
		index	index.php;

		if (!-e $request_filename) {
			rewrite	^(.*)$	/index.php?$1	last;
			break;
		}
	}

	location ~ .php$ {
		fastcgi_pass	php-fpm:9000;
		fastcgi_index	index.php;

		include	/etc/nginx/fastcgi_params;
		fastcgi_param	SCRIPT_FILENAME	/var/www/vhosts/storage.my-new-site.com/httpdocs$fastcgi_script_name;
		fastcgi_param	QUERY_STRING	$query_string;
		fastcgi_param	REQUEST_METHOD	$request_method;
		fastcgi_param	CONTENT_TYPE	$content_type;
		fastcgi_param	CONTENT_LENGTH	$content_length;
		# fastcgi_param	PHP_VALUE	"upload_max_filesize=820M \n post_max_size=820M";

		fastcgi_param	KOHANA_ENV	PRODUCTION;
	}

	location ~* ^.+.(jpg|jpeg|gif|css|png|js|ico)$ {
		access_log	off;
		expires	30d;
	}
}
