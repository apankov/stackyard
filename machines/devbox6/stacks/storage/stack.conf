# storage.my-new-site.com — объектное хранилище и приёмник вебхуков Fathom
# на PHP 5.6. Базы нет: всё лежит файлами в docroot'е.
#
# php-fpm теперь стек, а не платформенный сервис: поэтому он в Requires, и
# stack.sh не даст выключить его из-под живого сайта.
#
# Референсные копии кода — apps/object-storage/; развёрнутый экземпляр живёт в
# $Platform_Vhosts_Dir, то есть правка в репозитории сама по себе ничего не меняет.
Requires="php-fpm"
Domains="storage.my-new-site.com"
