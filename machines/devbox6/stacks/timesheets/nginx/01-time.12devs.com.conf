server {
	listen		80;
	server_name	time.12devs.com;

	client_max_body_size 32m;

	include		/etc/nginx/snippets/letsencrypt.conf;

	include		/etc/nginx/snippets/redirect-to-https.conf;
}



server {
	listen		443 ssl;
	http2		on;
	server_name	time.12devs.com;
	# client_max_body_size 820m;

	access_log	/var/log/nginx/time.12devs.com-access;
	error_log	/var/log/nginx/time.12devs.com-error;

	include			/etc/nginx/snippets/ssl-params.conf;
	ssl_certificate		/etc/nginx/certs/time.12devs.com-fullchain.crt;
	ssl_certificate_key	/etc/nginx/certs/time.12devs.com.key;

	include		/etc/nginx/snippets/letsencrypt.conf;

	# Declared at server level, not inside a location: the front-controller
	# rewrite below fires in the rewrite phase, before limit_req would run in
	# preaccess, so a per-location limit here would never be evaluated.
	# req_login only counts /user/login (see the map in 00-limits.conf);
	# req_general protects the php-fpm pool (pm.max_children = 20).
	limit_req	zone=req_login burst=5 nodelay;
	limit_req	zone=req_general burst=40 nodelay;

	root		/var/www/vhosts/time.12devs.com/httpdocs;
	index		index.php;

	location = / {
		root	/var/www/vhosts/time.12devs.com/httpdocs;
		index	index.php;
	}

	location / {
		root	/var/www/vhosts/time.12devs.com/httpdocs;
		index	index.php;

		if (!-e $request_filename) {
			# Front controller. Deliberately no `?$1`: that form turns the
			# request path into an empty GET parameter (`?/admin/foo=`), and
			# Kohana's URL::query() merges the whole $_GET into generated
			# links, so pagination produced `?%2Fadmin%2Ffoo=&page=2`.
			# Without a `?` in the replacement nginx appends the original
			# args itself, and Kohana takes the URI from REQUEST_URI anyway.
			rewrite	^	/index.php	last;
			break;
		}
	}

	location ~ .php$ {
		fastcgi_pass	php-fpm:9000;
		fastcgi_index	index.php;

		include	/etc/nginx/fastcgi_params;
		fastcgi_param	SCRIPT_FILENAME	/var/www/vhosts/time.12devs.com/httpdocs$fastcgi_script_name;
		fastcgi_param	QUERY_STRING	$query_string;
		fastcgi_param	REQUEST_METHOD	$request_method;
		fastcgi_param	CONTENT_TYPE	$content_type;
		fastcgi_param	CONTENT_LENGTH	$content_length;
		# fastcgi_param	PHP_VALUE	"upload_max_filesize=820M \n post_max_size=820M";

		fastcgi_param	KOHANA_ENV	PRODUCTION;
	}

	location ~* ^.+.(jpg|jpeg|gif|css|png|js|ico)$ {
		access_log	off;
		expires	30d;
	}
}
