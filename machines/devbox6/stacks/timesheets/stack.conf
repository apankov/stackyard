# time.12devs.com — учёт времени на Kohana/PHP 5.6.
#
# Своих контейнеров у стека нет: он живёт на платформенных nginx и php-fpm, а
# данные держит в общем MySQL. Ровно поэтому Requires обязателен — без него
# стек «включается» успешно и отдаёт 502 или «Access denied», то есть отказ
# переезжает из момента включения в рантайм, к посетителю.
Requires="mysql php-fpm"
Domains="time.12devs.com"

# База в общем MySQL. Значения — ссылки на .env стека, а не копии: вторая копия
# пароля разъезжается с ним молча и даёт `Access denied for user` при живой
# базе. База БОЕВАЯ и существует давно — инициализатор её не тронет, только
# сверит пользователя и права.
Mysql_DB="${Timesheets_DB_Name}"
Mysql_User="${Timesheets_DB_User}"
Mysql_Password="${Timesheets_DB_Password}"
