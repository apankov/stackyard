services:
  vault:
    image: hashicorp/vault
    container_name: vault
    hostname: vault
    restart: always
    cap_add:
      # Vault блокирует свою память от выгрузки в своп, чтобы ключи не попали
      # на диск. Без IPC_LOCK он стартует, но с предупреждением и без этой
      # защиты.
      - IPC_LOCK
    ports:
      - "8200:8200"
      - "8250:8250"
    volumes:
      - ${Platform_Deploy_Dir:?задайте Platform_Deploy_Dir в корневом .env}/stacks/vault/config:/vault/config:ro
      # Хранилище и init.file (ключи распечатывания и root-токен) — вне
      # репозитория и вне git, см. .gitignore.
      - ${Platform_Deploy_Dir:?задайте Platform_Deploy_Dir в корневом .env}/vault/file-storage:/vault/file-storage
      - /var/log/vault:/vault/logs
    command: server
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: $Platform_Network
