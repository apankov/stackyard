server {
    listen      80;
    server_name finance.my-new-site.com;

    client_max_body_size 1m;

    include /etc/nginx/snippets/letsencrypt.conf;

    include /etc/nginx/snippets/redirect-to-https.conf;
}

upstream finance_backend {
    ip_hash;
    server alfa-explorer:4202;
    keepalive 32;
}

server {
    listen      443 ssl;
    http2       on;
    server_name finance.my-new-site.com;

    client_max_body_size 1m;

    access_log /var/log/nginx/finance.my-new-site.com-access;
    error_log  /var/log/nginx/finance.my-new-site.com-error;

    include             /etc/nginx/snippets/ssl-params.conf;
    ssl_certificate     /etc/nginx/certs/finance.my-new-site.com-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/finance.my-new-site.com.key;

    include /etc/nginx/snippets/letsencrypt.conf;

    location / {
        proxy_pass http://finance_backend;

        proxy_http_version  1.1;
        proxy_set_header    Host                $host;
        proxy_set_header    X-Real-IP           $remote_addr;
        proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto   $scheme;

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }
}
