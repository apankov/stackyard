# Move the `latest` branch to the newest release, so that
#   https://raw.githubusercontent.com/apankov/stackyard/latest/install.sh
# always installs the newest release, the way getssl's `latest` URL does.
#
# By a workflow rather than by hand: moving it is a release step somebody would
# have to remember, and a `latest` left one release behind looks exactly like a
# working one.
#
# Only the operator CLI floats. A machine never follows `latest`: it runs the
# commit in its stackyard.lock (ADR 0001).
name: latest

# On tags, and on master too: GitHub creates no tag events at all when more
# than three tags arrive in one push, and v0.31.0 to v0.34.0 went out that way
# and left latest behind. A push to master always has an event, and every run
# answers the same question — which tag is the highest — so the extra runs cost
# nothing. workflow_dispatch is for a run by hand from the Actions tab.
on:
  push:
    tags: ['v*']
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# `git push --tags` with several new tags starts one run per tag; they must not
# race each other for the branch.
concurrency:
  group: latest
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move latest to the highest release
        run: |
          # Always the highest tag, whatever triggered the run: a tag pushed for
          # an older line (a backport, a late re-push) must not move latest
          # backwards.
          highest="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          target="$(git rev-parse "$highest^{commit}")"
          current="$(git ls-remote origin refs/heads/latest | cut -f1)"
          if [ "$current" = "$target" ]; then
            echo "latest is already $highest ($target)"
            exit 0
          fi
          # No --force: latest only ever fast-forwards. If it cannot, the run
          # fails and says so, rather than rewriting what people installed from.
          git push origin "$target:refs/heads/latest"
          echo "latest -> $highest ($target)"
