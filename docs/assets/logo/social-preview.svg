  <text x="446" y="318" font-family="Menlo, 'IBM Plex Mono', ui-monospace, monospace" font-size="104" font-weight="700" letter-spacing="-3"><tspan fill="#1F2A30">stack</tspan><tspan fill="#C4532D">yard</tspan></text>
  <text font-family="Menlo, 'IBM Plex Mono', ui-monospace, monospace" font-size="25" fill="#3D484D">
    <tspan x="450" y="382">Many small docker-compose projects on one host,</tspan>
    <tspan x="450" y="421">and a fleet of such hosts, pinned, from git.</tspan>
    <tspan x="450" y="460">Plain bash, agent-friendly.</tspan>
