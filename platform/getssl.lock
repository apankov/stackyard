# Откуда берётся getssl и какой именно.
#
# Раньше здесь лежала копия самого скрипта — 155 КБ чужого кода под GPL-3 в
# публичном репозитории под MIT. Копия ещё и разъезжалась: в ней накопились
# локальные правки, про которые через полгода никто уже не помнил, откуда они.
#
# Закрепление по СУММЕ, а не только по тегу: тег на GitHub можно передвинуть, а
# sha256 — нет. Кроме того, getssl умеет обновлять сам себя (`getssl -u`
# скачивает свежую версию и переписывает себя поверх). В юнитах поэтому стоит
# -U, отключающий даже проверку версии, а сумма здесь ловит случай, когда -u
# всё-таки запустили руками: иначе машина работала бы на коде, который никто не
# закреплял и не читал.
#
# Обновить: поменять version, взять новую сумму
#   curl -sS https://raw.githubusercontent.com/srvrco/getssl/<тег>/getssl | shasum -a 256
# и прогнать на машине ./platform/bin/getssl-fetch.sh
repo=https://github.com/srvrco/getssl
version=v2.52
sha256=c26d1a714fb96feeed2ac808cf16aae8e453d0005475e47e5732213ab1a7485e
