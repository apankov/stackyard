# Where getssl comes from, and which one.
#
# This used to hold a copy of the script itself -- 155 KB of someone else's
# GPL-3 code inside a public MIT repository. The copy also drifted: local edits
# accumulated in it that nobody could account for six months later.
#
# Pinned by CHECKSUM, not only by tag: a tag on GitHub can be moved, a sha256
# cannot. Besides, getssl can update itself (`getssl -u` downloads a fresh
# version and overwrites itself). The units therefore pass -U, which disables
# even the version check, and the checksum here catches the case where someone
# ran -u by hand anyway: otherwise the machine would run code nobody pinned and
# nobody read.
#
# To update: change version, take the new checksum with
#   curl -sS https://raw.githubusercontent.com/srvrco/getssl/<tag>/getssl | shasum -a 256
# and run ./platform/bin/getssl-fetch.sh on the machine.
repo=https://github.com/srvrco/getssl
version=v2.52
sha256=c26d1a714fb96feeed2ac808cf16aae8e453d0005475e47e5732213ab1a7485e
