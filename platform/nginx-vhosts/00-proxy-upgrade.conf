# Значение заголовка Connection для проксируемых запросов.
#
# Четыре vhost'а слали апстриму `Connection: upgrade` БЕЗУСЛОВНО, на каждом
# запросе. Для websocket'а это правильно, для обычного GET — нет: апстрим
# получает запрос, объявляющий переход на другой протокол, без единого признака
# этого перехода. Часть серверов такой запрос отвергает, часть закрывает
# соединение после ответа, и keepalive не живёт ни в одном случае.
#
# Вывод о том, что так нельзя, в репозитории уже был сделан — в комментарии
# vhost'а sanya-next, где заголовков нет намеренно. В четыре скопированных
# файла он не доехал; эта карта доводит его до них, не отнимая websocket'ов
# у тех, кому они нужны.
#
# Карта живёт в conf.d, а не в snippets: директива map работает в контексте
# http, а snippets включаются внутрь server и location.
#
# Пустой $http_upgrade -> `close`. Апстримного keepalive это не отнимает:
# блоков upstream с директивой keepalive здесь нет ни одного, то есть nginx и
# так открывает соединение на запрос.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
