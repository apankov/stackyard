# The value of the Connection header for proxied requests.
#
# Four vhosts used to send the upstream `Connection: upgrade` UNCONDITIONALLY,
# on every request. That is right for a websocket and wrong for an ordinary GET:
# the upstream receives a request announcing a switch to another protocol with
# no sign of that switch anywhere. Some servers reject such a request, some
# close the connection after responding, and keepalive survives in neither case.
#
# The conclusion that this is wrong had already been drawn in the repository --
# in a comment on one vhost where the headers are deliberately absent. It never
# reached the copied files; this map carries it to them without taking
# websockets away from those that need them.
#
# The map lives in conf.d rather than in snippets: the map directive works in
# the http context, while snippets are included inside server and location.
#
# An empty $http_upgrade -> `close`. That takes no upstream keepalive away:
# there is not a single upstream block with a keepalive directive here, so nginx
# opens a connection per request anyway.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
