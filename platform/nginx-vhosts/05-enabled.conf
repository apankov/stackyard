# Единственная строка, которой платформа читает состояние машины.
#
# Генерируемый список include'ов лежит в state/ машины, а не здесь: platform/ —
# общий слой, он перезаписывается целиком при каждом обновлении, и запись туда
# либо пропала бы, либо уехала соседней машине.
#
# Монтировать его ФАЙЛОМ внутрь conf.d нельзя, хотя так и было: conf.d сам
# смонтирован с :ro, а точку монтирования для вложенного файла docker создаёт
# внутри уже смонтированного каталога — и упирается в read-only. Контейнер не
# стартует вовсе, а сообщение говорит про mountpoint, то есть выглядит как
# поломка docker. Поэтому state/nginx-vhosts монтируется каталогом РЯДОМ, а
# читается отсюда.
#
# Префикс 05-: conf.d читается по алфавиту, и зоны лимитов из 00-limits.conf
# обязаны быть объявлены до любого server-блока. Порядок задаёт имя ЭТОГО
# файла, а не имя генерируемого, — то есть он не зависит от того, как назовут
# генерируемый файл потом.
#
# Шаблон без совпадений для nginx не ошибка: на машине, где стеки ещё не
# включали, каталог пуст, и это законное состояние.
include /etc/nginx/enabled/*.conf;
