# The single line with which the platform reads the machine's state.
#
# The generated list of includes lives in the machine's state/, not here:
# platform/ is a shared layer, overwritten wholesale on every update, so a write
# there would either vanish or ship to a neighbouring machine.
#
# Mounting it as a FILE inside conf.d is not possible, although that is what it
# used to do: conf.d is itself mounted :ro, and docker creates the mount point
# for a nested file inside the already-mounted directory -- and runs into
# read-only. The container does not start at all, and the message talks about a
# mountpoint, so it looks like a docker problem. That is why state/nginx-vhosts
# is mounted as a directory NEXT TO conf.d and read from here.
#
# The 05- prefix: conf.d is read alphabetically, and the limit zones from
# 00-limits.conf must be declared before any server block. The order is set by
# THIS file's name, not by the generated file's -- so it does not depend on what
# the generated file gets called later.
#
# A pattern that matches nothing is not an error for nginx: on a machine where
# no stack has been enabled yet the directory is empty, and that is a legitimate
# state.
include /etc/nginx/enabled/*.conf;
