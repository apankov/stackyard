# The default server: this is where a request lands whose Host matched no
# server_name in the vhosts of the enabled stacks.
#
# `default_server` is set EXPLICITLY. Without it nginx treats the FIRST vhost it
# read as the default -- so a stranger's request with an unknown Host lands on
# whichever production site happens to have the lowest numeric filename prefix.
# And that choice changes silently on any rename.

server {
	listen		80 default_server;

	return		301	https://google.com;
}


server {
	listen		443 ssl default_server;

	# A certificate is mandatory: `listen 443 ssl` without ssl_certificate means
	# nginx refuses to start, and with `restart: always` that is a crash loop
	# taking down EVERY site on the machine. This block is self-contained and
	# does not depend on other vhosts' certificates. The placeholder is created
	# by scripts/certs.sh.
	ssl_certificate		/etc/nginx/certs/nginx-selfsigned.crt;
	ssl_certificate_key	/etc/nginx/certs/nginx-selfsigned.key;

	return		301	https://google.com;
}
