# Сервер по умолчанию: сюда попадает запрос с Host, который не совпал ни с
# одним server_name из vhost'ов включённых стеков.
#
# `default_server` проставлен ЯВНО. Без него nginx считает сервером по
# умолчанию ПЕРВЫЙ прочитанный vhost — на этой машине им был
# 01-time.12devs.com, то есть чужой запрос попадал на боевой сайт учёта
# времени. Выбор при этом зависел от числового префикса имени файла и менялся
# молча при любом переименовании.

server {
	listen		80 default_server;

	return		301	https://google.com;
}


server {
	listen		443 ssl default_server;

	# Сертификат обязателен: `listen 443 ssl` без ssl_certificate — это отказ
	# старта nginx, а с `restart: always` краш-луп, уносящий ВСЕ сайты машины.
	# Блок самодостаточен и не зависит от сертификатов других vhost'ов.
	# Заглушку создаёт scripts/certs.sh.
	ssl_certificate		/etc/nginx/certs/nginx-selfsigned.crt;
	ssl_certificate_key	/etc/nginx/certs/nginx-selfsigned.key;

	return		301	https://google.com;
}
