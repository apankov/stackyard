# ============================================================================
# Общие зоны лимитов.
# ============================================================================
# Зоны обязаны жить в контексте http; файлы conf.d включаются именно туда.
# Префикс 00- ставит этот файл перед генерируемым 10-enabled.conf, из которого
# читаются vhost'ы стеков: nginx разрешает имя зоны в момент разбора
# server-блока, и зона, определённая позже, для него не существует — отказ
# старта с "unknown limit_req_zone".
#
# Смысл лимитов здесь, а не в приложениях: nginx отклоняет запрос до того, как
# занят воркер приложения, а пулы на таких машинах короткие.
#
# ЗДЕСЬ ТОЛЬКО ОБЩЕЕ. Всё, что зависит от конкретной машины — какой URI считать
# логином, сколько запросов терпимо для её сайтов, — живёт в nginx/ самой
# машины и включается оттуда. Иначе политика одного девбокса уезжает на все
# остальные: зона с картой по /user/login осмысленна ровно там, где есть
# Kohana с таким адресом.
#
# Размер 1m, а не 10m. Зона выделяется при разборе конфига независимо от того,
# пользуется ей кто-нибудь или нет, а машины здесь тесные — на одной свободно
# около 200 МБ. 1m держит порядка 16 тысяч адресов, чего этим сайтам хватает с
# запасом; машине, которой не хватит, ничто не мешает объявить свою зону.

# Обычный трафик. Намеренно свободно: это про исчерпание, а не про полицию.
limit_req_zone $binary_remote_addr zone=req_general:1m rate=20r/s;

# Машинные эндпоинты: API, объектные хранилища.
limit_req_zone $binary_remote_addr zone=req_api:1m rate=10r/s;

# Приём вебхуков. Отдельно от req_api: источник чужой и его частоту мы не
# контролируем, а смешение с собственным API означало бы, что чужой всплеск
# выжигает лимит своему.
limit_req_zone $binary_remote_addr zone=req_webhook:1m rate=30r/s;

# Долгоживущие соединения (WebSocket). Цена здесь — удерживаемое соединение, а
# не частота запросов, поэтому limit_conn, а не limit_req.
limit_conn_zone $binary_remote_addr zone=conn_addr:1m;

# 429 — честный ответ; nginx по умолчанию отдаёт 503, который читается как
# «мы сломались».
limit_req_status 429;
limit_conn_status 429;

# "error", а не "notice": в per-vhost error_log уровень не указан, то есть по
# умолчанию error и выше. На notice эти строки не попали бы никуда — и
# fail2ban было бы нечего читать.
limit_req_log_level error;
limit_conn_log_level error;
