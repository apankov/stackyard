# ============================================================================
# Shared rate/connection limit zones.
# ============================================================================
# Zones must live in the http context; files in conf.d are included there, and
# the 00- prefix makes this load before the vhosts that reference the zones.
#
# The point of limiting here rather than in the applications: nginx rejects the
# request before a php-fpm worker is taken, and the pool is only
# pm.max_children = 20 deep.
#
# 10m of zone state holds roughly 160k distinct addresses.

# General browsing traffic. Deliberately loose - this is about exhaustion, not
# about policing normal use.
limit_req_zone $binary_remote_addr zone=req_general:10m rate=20r/s;

# Machine-to-machine endpoints (object storage, REST APIs).
limit_req_zone $binary_remote_addr zone=req_api:10m rate=10r/s;

# Login forms and anything else worth brute-forcing. Tight on purpose.
#
# Keyed through a map rather than directly on the address, because limit_req
# cannot be scoped to a location here: these vhosts rewrite every unknown URI to
# index.php with "last", and that rewrite happens in the rewrite phase - before
# the preaccess phase where limit_req runs. A limit_req inside such a location
# is silently never evaluated. So the directive goes at server level, and the
# map decides which requests it actually counts: an empty key disables the limit
# for everything that is not a login URL.
#
# $request_uri keeps the original URI after the internal rewrite, unlike $uri,
# so matching still works once the request has been redirected to index.php.
map $request_uri $login_limit_key {
    default        "";
    ~*^/user/login $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=req_login:10m rate=10r/m;

# Long-lived connections (WebSocket): the cost is the held connection, not the
# request rate, so this needs limit_conn rather than limit_req.
limit_conn_zone $binary_remote_addr zone=conn_ws:10m;

# 429 is the honest answer; nginx defaults to 503, which reads as "we broke".
limit_req_status 429;
limit_conn_status 429;

# "error", not "notice": the per-vhost error_log directives specify no level, so
# they default to error and above. At notice these lines would be written
# nowhere, which defeats the point of logging them - and fail2ban would have
# nothing to read.
limit_req_log_level error;
limit_conn_log_level error;
