# ============================================================================
# Shared limit zones.
# ============================================================================
# Zones must live in the http context, and that is where conf.d files are
# included. The 00- prefix puts this file before the generated 10-enabled.conf
# that the stacks' vhosts are read from: nginx resolves a zone name while
# parsing the server block, and a zone defined later does not exist for it --
# a startup refusal with "unknown limit_req_zone".
#
# The limits belong here rather than in the applications: nginx rejects a
# request before an application worker is occupied, and the pools on machines
# like these are short.
#
# ONLY SHARED THINGS HERE. Anything that depends on a particular machine --
# which URI counts as a login, how many requests its sites tolerate -- lives in
# that machine's own nginx/ and is included from there. Otherwise one devbox's
# policy ships to all the others: a zone keyed on /user/login makes sense
# exactly where a Kohana with that address exists.
#
# The size is 1m, not 10m. A zone is allocated when the config is parsed
# whether or not anybody uses it, and the machines here are cramped -- one has
# about 200 MB free. 1m holds on the order of 16 thousand addresses, which is
# ample for these sites; a machine that needs more is free to declare its own
# zone.

# Ordinary traffic. Deliberately loose: this is about exhaustion, not
# policing.
limit_req_zone $binary_remote_addr zone=req_general:1m rate=20r/s;

# Machine-to-machine endpoints: APIs, object storage.
limit_req_zone $binary_remote_addr zone=req_api:1m rate=10r/s;

# Receiving webhooks. Separate from req_api: the source is someone else's and
# we do not control its rate, and mixing it with our own API would mean a
# foreign spike burns through our own budget.
limit_req_zone $binary_remote_addr zone=req_webhook:1m rate=30r/s;

# Long-lived connections (WebSocket). The cost here is a held connection rather
# than a request rate, hence limit_conn and not limit_req.
limit_conn_zone $binary_remote_addr zone=conn_addr:1m;

# 429 is the honest answer; nginx returns 503 by default, which reads as "we
# broke".
limit_req_status 429;
limit_conn_status 429;

# "error", not "notice": the per-vhost error_log specifies no level, so the
# default is error and above. At notice these lines would go nowhere -- and
# fail2ban would have nothing to read.
limit_req_log_level error;
limit_conn_log_level error;
