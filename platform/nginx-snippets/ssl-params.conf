# HTTP/2. Here rather than in every vhost: otherwise it gets lost whenever a new
# site is set up, and that is visible only in devtools -- everything works, just
# over HTTP/1.1. This directive is exactly why the image was raised to 1.30; it
# does not exist in 1.19.
#
# The directive appeared in nginx 1.25.1. Rolling the image back BELOW that
# means an unknown directive, i.e. an nginx that does not start and a crash loop
# under restart: always -- so the image can only be rolled back together with
# this line. Compatibility is verified by stack.sh --check, the "nginx image"
# block.
#
# A duplicate in a server block is a "duplicate directive" error, not a harmless
# repetition: the snippet is included inside server, and an http2 from a vhost
# would collide with it. That is why the directive was removed from the
# machines' vhosts.
http2 on;

# ssl on; -- deprecated
ssl_session_timeout 24h;

ssl_protocols TLSv1.2 TLSv1.3;    # was: TLSv1 TLSv1.1 TLSv1.2
ssl_prefer_server_ciphers on;
ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH:!aNULL";
ssl_ecdh_curve secp384r1;
ssl_session_cache shared:SSL:10m;
# ssl_session_tickets off;

# disable HSTS header for now
#add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
#
# "always": without it nginx omits add_header on non-2xx/3xx responses, so every
# 403/404/5xx - including the object-storage auth rejection - went out with no
# clickjacking or MIME-sniffing protection. Confirmed empirically against a 403.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;

ssl_dhparam /etc/nginx/certs/dhparam.pem;

