# HTTP/2. Здесь, а не в каждом vhost'е: иначе он теряется при заведении нового
# сайта, и заметно это только в devtools — всё работает, просто по HTTP/1.1.
# Именно ради этой директивы образ подняли до 1.30; в 1.19 её не существует.
#
# Директива появилась в nginx 1.25.1. Откат образа НИЖЕ неё означает неизвестную
# директиву, то есть не стартующий nginx и краш-луп по restart: always —
# поэтому откатывать образ можно только вместе с этой строкой. Совместимость
# сверяет stack.sh --check, блок «Образ nginx».
#
# Дубль в server-блоке — ошибка "duplicate directive", а не безобидное
# повторение: сниппет включается внутрь server, и http2 из vhost'а столкнулся
# бы с этим. Поэтому из vhost'ов машин директива убрана.
http2 on;

# ssl on; -- deprecated
ssl_session_timeout 24h;

ssl_protocols TLSv1.2 TLSv1.3;    # было: TLSv1 TLSv1.1 TLSv1.2
ssl_prefer_server_ciphers on;
ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH:!aNULL";
ssl_ecdh_curve secp384r1;
ssl_session_cache shared:SSL:10m;
# ssl_session_tickets off;

# disable HSTS header for now
#add_header Strict-Transport-Security "max-age=63072000; includeSubDomains";
#
# "always": without it nginx omits add_header on non-2xx/3xx responses, so every
# 403/404/5xx - including the object-storage auth rejection - went out with no
# clickjacking or MIME-sniffing protection. Confirmed empirically against a 403.
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;

ssl_dhparam /etc/nginx/certs/dhparam.pem;

