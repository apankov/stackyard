services:
  nginx:
    image: ${Platform_Nginx_Image:-nginx:1.30-alpine}
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${Platform_Deploy_Dir:?}/platform/nginx-snippets:/etc/nginx/snippets:ro
      # Static platform vhosts: default.conf (the default server) and
      # 00-limits.conf (limit zones, which must live in the http context).
      - ${Platform_Deploy_Dir:?}/platform/nginx-vhosts:/etc/nginx/conf.d:ro
      # The machine's generated vhosts go in a DIRECTORY NEXT TO conf.d, and
      # platform/nginx-vhosts/05-enabled.conf reads them from there with a
      # single include line.
      #
      # This used to mount a file inside conf.d, and that could never work:
      # conf.d is itself mounted :ro, and docker creates the mount point for a
      # nested file INSIDE the already-mounted directory. The container did not
      # start at all, and the message talked about a mountpoint -- so the
      # failure looked like a docker problem rather than a wrong spec.
      #
      # Putting generated files inside platform/ is still not allowed: it is a
      # symlink to a shared directory (in the workspace) or a vendored copy (on
      # a machine), and writing there either breaks a neighbouring machine or
      # disappears at the next platform update.
      - ${Platform_Deploy_Dir:?}/state/nginx-vhosts:/etc/nginx/enabled:ro
      # Both stack roots in full, read-only: vhosts are read exclusively
      # through the includes in 10-enabled.conf -- that is what disabling a
      # stack consists of. The mounts are constant and do not depend on which
      # stacks are enabled.
      # The machine's own http config: its limit zones and maps. Included from
      # the generated 10-enabled.conf as its first line, before any server
      # block.
      - ${Platform_Deploy_Dir:?}/nginx:/etc/nginx/machine:ro
      - ${Platform_Deploy_Dir:?}/stacks:/etc/nginx/stacks:ro
      - ${Platform_Deploy_Dir:?}/profile/stacks:/etc/nginx/profile-stacks:ro
      # basic-auth files. In state/, not in platform/: the platform is shared
      # and bootstrap overwrites it wholesale, while these are the machine's
      # secrets.
      #
      # The directory is always mounted, even when empty: a vhost whose
      # auth_basic_user_file points at an unmounted path means a 500 on every
      # request, and that is visible only from outside.
      - ${Platform_Deploy_Dir:?}/state/htpasswd:/etc/nginx/htpasswd:ro
      - ${Platform_Deploy_Dir:?}/platform/acme:/var/www/acme
      - ${Platform_Deploy_Dir:?}/state/certs:/etc/nginx/certs
      - ${Platform_Vhosts_Dir:?}:${Platform_Vhosts_Mount:?}
      - /var/log/nginx:/var/log/nginx
    # An upstream is not required to live in our network. A stand in someone
    # else's compose project, or a process on the host itself, is reachable only
    # through host-gateway.
    #
    # The alternative -- declaring the other network external and attaching
    # nginx to it -- means a `down` in the other repository takes that network
    # away, and nginx with it. Losing nginx also loses the ACME challenge
    # handler, so certificate renewal breaks exactly when someone else's stand
    # is down.
    #
    # It is always present: it is one entry in the container's /etc/hosts, and
    # it costs a machine that does not need it nothing.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
