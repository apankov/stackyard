services:
  nginx:
    image: ${Platform_Nginx_Image:-nginx:1.30-alpine}
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${Platform_Deploy_Dir:?}/platform/nginx-snippets:/etc/nginx/snippets:ro
      # Статические платформенные vhost'ы: default.conf (сервер по умолчанию) и
      # 00-limits.conf (зоны лимитов, обязаны быть в http-контексте).
      - ${Platform_Deploy_Dir:?}/platform/nginx-vhosts:/etc/nginx/conf.d:ro
      # Генерируемый список include'ов — ОДНИМ ФАЙЛОМ поверх conf.d. Каталог
      # conf.d у nginx один, а источников два: неизменяемая платформа и
      # состояние машины. Класть генерируемое внутрь platform/ нельзя — это
      # симлинк на общий каталог (в рабочем пространстве) или вендоренная копия
      # (на машине), и запись туда либо ломает соседнюю машину, либо пропадает
      # при следующем обновлении платформы.
      - ${Platform_Deploy_Dir:?}/state/nginx-vhosts/10-enabled.conf:/etc/nginx/conf.d/10-enabled.conf:ro
      # Оба корня стеков целиком, только на чтение: vhost'ы читаются
      # исключительно через include'ы из 10-enabled.conf — в этом и состоит
      # механизм выключения стека. Монтирования постоянные и от набора
      # включённых стеков не зависят.
      # http-конфиг самой машины: её зоны лимитов и карты. Включается из
      # генерируемого 10-enabled.conf первой строкой, до любого server-блока.
      - ${Platform_Deploy_Dir:?}/nginx:/etc/nginx/machine:ro
      - ${Platform_Deploy_Dir:?}/stacks:/etc/nginx/stacks:ro
      - ${Platform_Deploy_Dir:?}/profile/stacks:/etc/nginx/profile-stacks:ro
      # Файлы basic-auth. В state/, а не в platform/: платформа общая и
      # перезаписывается bootstrap'ом целиком, а это секреты машины.
      #
      # Каталог смонтирован всегда, даже пустой: vhost с auth_basic_user_file
      # на несмонтированный путь — это 500 на каждом запросе, и заметно это
      # только снаружи.
      - ${Platform_Deploy_Dir:?}/state/htpasswd:/etc/nginx/htpasswd:ro
      - ${Platform_Deploy_Dir:?}/platform/acme:/var/www/acme
      - ${Platform_Deploy_Dir:?}/state/certs:/etc/nginx/certs
      - ${Platform_Vhosts_Dir:?}:${Platform_Vhosts_Mount:?}
      - /var/log/nginx:/var/log/nginx
    # Апстрим не обязан жить в нашей сети. Стенд в чужом compose-проекте или
    # процесс на самом хосте доступны только через host-gateway.
    #
    # Альтернатива — объявить чужую сеть external и подключить к ней nginx —
    # означает, что `down` в чужом репозитории уносит эту сеть, а с ней nginx.
    # Вместе с nginx пропадает обработчик ACME-челленджа, то есть продление
    # сертификатов ломается ровно тогда, когда чужой стенд лежит.
    #
    # Стоит всегда: это одна запись в /etc/hosts контейнера, и машине, которой
    # она не нужна, она ничего не стоит.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
