# Rotation of the platform nginx's logs. A template: nginx-logrotate.sh fills in
# @ROTATE@ and @DAYS@ from Platform_Nginx_Log_Days and hands logrotate a
# root-owned copy, because logrotate running as root refuses a config owned by
# anyone else ("file owner is wrong") — and the checkout belongs to the
# deployment's user.
#
# The rendered copy does NOT go into /etc/logrotate.d: the distribution's own
# logrotate.timer would pick it up as well, and the same files would be rotated
# twice against two independent state files. Only devbox-nginx-logrotate.service
# runs it, with a state file of its own.
#
# What gets rotated is a naming convention, not a list: the platform does not
# know which vhosts a machine has. A vhost logs to
# /var/log/nginx/<name>-access and <name>-error, or to anything ending in .log.
# A file named otherwise is not rotated, and check-nginx-logs.sh names it.
#
# The patterns never match a rotated generation: dateext appends -YYYYMMDD (and
# .gz) AFTER the name, so `*-access` stops matching it. A bare `*` would rotate
# yesterday's .gz again, every night.
/var/log/nginx/*-access /var/log/nginx/*-error /var/log/nginx/*.log {
    daily
    # @ROTATE@ rotated generations plus the live file: no more than @DAYS@ days
    # of records. maxage removes generations that outlived missed runs (a
    # machine that was off), which the count alone would keep.
    rotate @ROTATE@
    maxage @DAYS@
    dateext

    compress
    # Yesterday's generation stays uncompressed until the next run: if nginx
    # has not reopened its logs yet, it is still writing into that file, and
    # lines appended to a file being gzipped are lost.
    delaycompress

    missingok
    notifempty

    # One signal for all the files, not one per file.
    sharedscripts
    postrotate
        # USR1 reopens the logs. Without it nginx keeps writing into the renamed
        # file, and a day later delaycompress gzips a file still being written.
        # The failure is NOT swallowed (no `|| true`): a signal that did not
        # arrive fails the unit, and OnFailure says so. `nginx` is the
        # container name platform/compose/nginx.yaml sets.
        docker kill --signal=USR1 nginx >/dev/null
    endscript
}
