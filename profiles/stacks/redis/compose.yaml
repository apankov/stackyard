services:
  redisd:
    image: redis
    container_name: redisd
    restart: always
    ports:
      # Loopback only: Docker's port rules sit ahead of the host firewall, so a
      # port published on every interface is open to the internet whatever the
      # security group says. redis has no password by default; the containers use the docker network.
      - "127.0.0.1:6379:6379"
    volumes:
      - ${Redis_Data_Dir:?set Redis_Data_Dir in stacks/redis/.env}:/data
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
