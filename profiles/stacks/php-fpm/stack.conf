# PHP 5.6 FastCGI для legacy-сайтов (Kohana и прочее, что на современном PHP
# не работает). Профильный стек.
#
# Это СТЕК, а не часть платформы, и это изменение по сравнению с devbox6.
# Платформенным обязано быть только то, во что стеки домешивают (сегодня —
# один nginx, из-за Static=). В php-fpm никто ничего не домешивает: его спека
# постоянна сама по себе, единственный том — общий Platform_Vhosts_Dir.
#
# Выигрыш конкретный: PHP-сайт объявляет Requires="php-fpm", и stack.sh
# выстраивает порядок сам, а выключить php-fpm из-под живого сайта не даёт.
# Пока php-fpm был платформенным, его не охранял никто.
Requires=""
