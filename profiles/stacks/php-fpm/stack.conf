# PHP 5.6 FastCGI for legacy sites (Kohana and anything else that does not run
# on a modern PHP). A profile stack.
#
# This is a STACK, not part of the platform.
# Only what stacks mix into belongs to the platform (today that is nginx alone,
# because of Static=). Nobody mixes anything into php-fpm: its spec is constant
# by itself, and its only volume is the shared Platform_Vhosts_Dir.
#
# The gain is concrete: a PHP site declares Requires="php-fpm", stack.sh works
# out the order by itself, and it refuses to disable php-fpm from under a live
# site. While php-fpm was part of the platform, nothing guarded it.
Requires=""
