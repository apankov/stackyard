# PHP 5.6 FastCGI. The image base (alpine 3.8, php5 packages) is EOL on
# purpose: the sites it exists for do not run on a modern PHP.
services:
  php-fpm:
    build:
      context: ${Php_Stack_Dir:-${Platform_Deploy_Dir}/profile/stacks/php-fpm}/build
    image: php5.6-fpm
    container_name: php-fpm
    restart: always
    ports:
      - "9000:9000"
    volumes:
      # The only volume is the shared docroot directory, the same one nginx
      # gets. Nothing per-stack is mixed in here, so the spec is constant and
      # disabling somebody else's stack does not change it.
      - ${Platform_Vhosts_Dir:?}:${Platform_Vhosts_Mount:?}
    networks:
      - shared_network

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
