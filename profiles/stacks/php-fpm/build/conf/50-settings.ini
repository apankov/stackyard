; date.timezone = "Europe/Madrid"
date.timezone = "UTC"
short_open_tag = Off
session.auto_start = Off

; Stop advertising the exact PHP version in the X-Powered-By header. Confirmed
; leaking "PHP/5.6.40" externally, which hands an attacker the precise EOL build
; to match CVEs against.
expose_php = Off

; Defence in depth for the FastCGI path-info attack: never run a request whose
; resolved script does not exist, and never treat /x.jpg/y.php as a PHP file.
cgi.fix_pathinfo = 0
allow_url_include = Off


extension=bcmath.so
extension=ctype.so
extension=dom.so
extension=gd.so
extension=iconv.so
extension=intl.so
extension=json.so
extension=mcrypt.so
zend_extension=opcache.so
extension=openssl.so
extension=phar.so
extension=posix.so
extension=xml.so
extension=zip.so
