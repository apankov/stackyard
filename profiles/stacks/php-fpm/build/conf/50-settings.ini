; date.timezone = "Europe/Madrid"
date.timezone = "UTC"
short_open_tag = Off
session.auto_start = Off

; Stop advertising the exact PHP version in the X-Powered-By header. Confirmed
; leaking "PHP/5.6.40" externally, which hands an attacker the precise EOL build
; to match CVEs against.
expose_php = Off

; Defence in depth for the FastCGI path-info attack: never run a request whose
; resolved script does not exist, and never treat /x.jpg/y.php as a PHP file.
cgi.fix_pathinfo = 0
allow_url_include = Off

; CVE-2026-109618 / CVE-2026-109619: an OOM in the middle of request parsing
; leaves a half-built array that PHP treats as ready, and the upload-progress
; tracker turns it into a use-after-free with an address leak back through
; PHPSESSID -- unauthenticated code execution, exploited in the wild. Every PHP
; since 5.4 is affected and the 5.x branch gets no fix, so for this image the
; setting is the remedy, not a stopgap. Nothing here uses upload progress: it
; needs a JS poller reading $_SESSION during the upload.
session.upload_progress.enabled = Off


extension=bcmath.so
extension=ctype.so
extension=dom.so
extension=gd.so
extension=iconv.so
extension=intl.so
extension=json.so
extension=mcrypt.so
