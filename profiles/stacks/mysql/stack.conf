# Общий MySQL. Профильный стек: переиспользуется машинами как есть.
#
# Базы, пользователей и их права заводит инициализатор из
# <машина>/state/mysql/databases.yaml — файл генерируется платформой, серверный,
# в git его нет.
Requires=""

# Роль, а не имя. Движок не знает слова «MySQL»: он видит, что этот стек —
# поставщик общей БД, и что заказы к нему пишутся ключами с префиксом Mysql_.
# Машина на Postgres включает вместо этого стек pg с Provides_DB="Postgres",
# и ни одна строка платформы от этого не меняется.
Provides_DB="Mysql"
DB_Init_Service="mysql-initializer"
