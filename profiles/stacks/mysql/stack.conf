# The shared MySQL. A profile stack: reused by machines as is.
#
# Databases, users and their privileges are created by the initializer from
# <machine>/state/mysql/databases.yaml -- a file generated by the platform,
# server-side, not in git.
Requires=""

# A role, not a name. The engine does not know the word "MySQL": it sees that
# this stack is the shared-DB provider and that orders to it are written with
# keys prefixed Mysql_. A machine on Postgres enables the pg stack with
# Provides_DB="Postgres" instead, and not one line of the platform changes.
Provides_DB="Mysql"
DB_Init_Service="mysql-initializer"
