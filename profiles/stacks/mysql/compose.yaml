services:

  mysqld:
    image: devilbox/mysql:mysql-5.5
    container_name: mysqld
    restart: always
    ports:
      - "3306:3306"
    networks:
      - shared_network
    volumes:
      # The machine's production data. No platform command deletes it:
      # `stack.sh purge` only touches named volumes, and this is a bind mount.
      - ${Mysql_Data_Dir:?set Mysql_Data_Dir in stacks/mysql/.env}:/var/lib/mysql
      # sql_mode and character sets come from a file, not from a `SET GLOBAL`
      # after startup. `SET GLOBAL` lives until the container is next restarted,
      # i.e. the setting quietly disappears exactly when the container is
      # recreated.
      - ${Mysql_Stack_Dir:-${Platform_Deploy_Dir}/profile/stacks/mysql}/conf:/etc/mysql/conf.d:ro
    environment:
      # On the left is the image's contract: mysqld itself reads that name
      # inside the container, so it cannot be renamed. On the right is our own
      # local name.
      - MYSQL_ROOT_PASSWORD=${Mysql_Root_Password:?set Mysql_Root_Password in stacks/mysql/.env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-initializer:
    image: alpine:3.19
    container_name: mysql-initializer
    networks:
      - shared_network
    volumes:
      - ${Mysql_Stack_Dir:-${Platform_Deploy_Dir}/profile/stacks/mysql}/db-init/initializer.sh:/initializer.sh:ro
      # The database list is generated by the platform and lives in the
      # machine's state/, not next to the script: writing inside profile/ is not
      # allowed -- the next profile update would overwrite the file, and the
      # profile's git would see the passwords of every database on the
      # machine.
      - ${Platform_Deploy_Dir:?}/state/mysql/databases.yaml:/config/databases.yaml:ro
      - ${Platform_Deploy_Dir:?}/dumps:/dumps:ro
    environment:
      - MYSQL_ROOT_PASSWORD=${Mysql_Root_Password:?set Mysql_Root_Password in stacks/mysql/.env}
    # The MariaDB client talks to MySQL 5.5 normally (mysql_native_password).
    # yq is there to parse databases.yaml: a hand-rolled parser would cut the
    # password at the first special character and produce a user nobody can
    # connect as.
    entrypoint: >
      sh -c "apk add --no-cache mariadb-client yq bash >/dev/null && bash /initializer.sh"
    depends_on:
      mysqld:
        condition: service_healthy

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
