# Общий PostgreSQL. Профильный стек: переиспользуется машинами как есть.
#
# Базы и пользователей заводит инициализатор из
# <машина>/state/pg/databases.yaml — файл генерируется платформой, серверный,
# в git его нет.
Requires=""

# Роль, а не имя — см. profiles/stacks/mysql/stack.conf. Заказы к этому
# поставщику пишутся ключами Postgres_DB / Postgres_User / Postgres_Password.
Provides_DB="Postgres"
DB_Init_Service="db-initializer"
