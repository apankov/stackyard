# The shared PostgreSQL. A profile stack: reused by machines as is.
#
# Databases and users are created by the initializer from
# <machine>/state/pg/databases.yaml -- a file generated by the platform,
# server-side, not in git.
Requires=""

# A role, not a name -- see profiles/stacks/mysql/stack.conf. Orders to this
# provider are written with the keys Postgres_DB / Postgres_User /
# Postgres_Password.
Provides_DB="Postgres"
DB_Init_Service="db-initializer"
