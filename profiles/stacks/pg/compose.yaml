services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    ports:
      - "5432:5432"
    networks:
      - shared_network
    volumes:
      - ${Pg_Data_Dir:?set Pg_Data_Dir in stacks/pg/.env}:/var/lib/postgresql/data
    environment:
      # The image's contract on the left, our own names on the right. The
      # prefix is deliberately Pg_ and not Postgres_: Postgres_* are the keys of
      # a database ORDER, written by consumer stacks. Had we named our
      # superuser credentials with the same prefix, the generator would see the
      # pg stack as a consumer of itself.
      - POSTGRES_USER=${Pg_Root_User:?}
      - POSTGRES_PASSWORD=${Pg_Root_Password:?}
      - POSTGRES_DB=${Pg_Root_DB:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-initializer:
    image: postgres:16-alpine
    container_name: db-initializer
    networks:
      - shared_network
    volumes:
      - ${Pg_Stack_Dir:-${Platform_Deploy_Dir}/profile/stacks/pg}/db-init/initializer.sh:/initializer.sh:ro
      # The database list lives in the machine's state/, not next to the
      # script: writing inside profile/ is not allowed, the next profile update
      # would overwrite it.
      - ${Platform_Deploy_Dir:?}/state/pg/databases.yaml:/config/databases.yaml:ro
      - ${Platform_Deploy_Dir:?}/dumps:/dumps:ro
    environment:
      - POSTGRES_USER=${Pg_Root_User:?}
      - POSTGRES_PASSWORD=${Pg_Root_Password:?}
    entrypoint: >
      sh -c "apk add --no-cache yq bash && bash /initializer.sh"
    depends_on:
      - postgres

networks:
  shared_network:
    external: true
    name: ${Platform_Network:?}
